apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: rohandocker1234/backend-depl
          ports:
            - containerPort: 8081
          env:
            - name: MONGO_DB_URL
              value: "mongodb://localhost:27017/graphqlSmDB?readPreference=primary&appname=MongoDB%20Compass&directConnection=true&ssl=false"
            - name: "JWT_SECRET_KEY"
              value: "secret"
            - name: "CLOUD_NAME"
              value: "dqklxkay4"
            - name: "CLOUD_API_KEY"
              value: "578337955933654"
            - name: "CLOUD_API_SECRET"
              value: "mvUtuQOvwDCezE43_Iraxq6vYqk"
            - name: "ORIGIN_URL"
              value: "http://localhost:5173"
            - name: "REDIS_HOST"
              value: "localhost"
            - name: "REDIS_PORT"
              value: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-srv
spec:
  selector:
    app: backend
  ports:
    - name: backend
      protocol: TCP
      port: 8081
      targetPort: 8081
