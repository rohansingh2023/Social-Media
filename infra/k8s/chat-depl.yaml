apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      labels:
        app: chat
    spec:
      containers:
        - name: chat
          image: rohandocker1234/chat-depl
          ports:
            - containerPort: 3001
          env:
            - name: DB_URL
              value: "mongodb://localhost:27017/smChatDb?readPreference=primary&appname=MongoDB%20Compass&directConnection=true&ssl=false"
---
apiVersion: v1
kind: Service
metadata:
  name: chat-srv
spec:
  selector:
    app: chat
  ports:
    - name: chat
      protocol: TCP
      port: 3001
      targetPort: 3001
